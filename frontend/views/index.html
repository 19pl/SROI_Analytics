<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SROI | Calculator</title>

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages/calculator.css" />
    <link rel="stylesheet" href="/css/pages/about.css" />
  </head>

  <body>
    <div class="app" id="app">
      <!-- เมนูด้านข้าง: รายการเมนูถูกสร้างโดย public/js/main.js จาก routes.js -->
      <aside class="shell-sidebar">
        <div class="brand">
          <img class="brand-logo" src="/images/logo.png" alt="โลโก้ NU SROI" />
          <span>SROI</span>
        </div>
        <nav class="nav" id="nav"></nav>
      </aside>

      <header class="shell-header">
        <button class="btn-ghost-shell" id="toggleSidebar" aria-label="ย่อหรือขยายเมนู">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 3v18" />
          </svg>
        </button>
        <span class="header-title" id="headerTitle"></span>
        <span class="badge badge-mock">มหาวิทยาลัยนเรศวร</span>
      </header>

      <!-- พื้นที่เนื้อหา: แต่ละหน้า (views/*.js) จะวาดลงใน #view -->
      <main class="workspace">
        <div class="container" id="view"></div>
      </main>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
